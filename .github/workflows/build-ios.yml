name: Build Mush8 iOS IPA

on:
  workflow_dispatch: # Allows manual trigger via a button

jobs:
  build:
    runs-on: macos-14 # GitHub-hosted Apple Silicon M1 runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Homebrew tools
        run: |
          brew install xcodegen

      - name: Set up Rust toolchain
        run: |
          # Mush8 specifies Rust 1.98.1 for the iOS target
          rustup toolchain install 1.98.1
          rustup default 1.98.1
          rustup target add aarch64-apple-ios --toolchain 1.98.1

      - name: Make scripts executable
        run: |
          chmod +x make-ios.sh build.sh || true

      - name: Build unsigned IPA
        run: |
          ./make-ios.sh --ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mush8-iOS-IPA
          path: build/Mush8.ipa
          if-no-files-found: error
